on:
  workflow_dispatch:   # manual trigger
  schedule:
    - cron: '0 0 8,22 * *'  # runs at midnight on the 8th and 22nd

name: Sync Images
permissions:
  contents: write
  pull-requests: write

# One run at a time: overlapping runs would race on the same bot branch.
concurrency: sync-images

jobs:
  sync_images:
    name: Sync Images
    runs-on: ubuntu-latest
    
    defaults:
      run:
        shell: bash
    
    steps:
    
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: true
          
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 19.6.0
          
      - name: Run code to Sync Images
        working-directory: ./.github/workflows/utility
        run: node sync_images.mjs
      
      # Signed commit via the GitHub API: master requires signed commits,
      # and a plain `git push` from a workflow is unsigned.
      - name: Add Commit Push
        id: commit
        uses: ./.github/actions/signed-commit
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update/images
          message: "[AUTO]Sync Images"
      
      - name: Create A PR
        if: steps.commit.outputs.changed == 'true'
        uses: devops-infra/action-pull-request@v0.4.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          source_branch: update/images
          target_branch: master
          title: Sync Images
          body: "**Automated pull request** If closing, remember to delete the branch!"
          old_string: "**THIS IS AN AUTOMATED UPDATE OF IMAGES**"
          new_string: "** Automatic pull request**"
          get_diff: true
          ignore_users: "dependabot"



